display_information:
  name: Smith
  description: An engineering agent with a machine of its own.
features:
  bot_user:
    display_name: Smith
    always_online: true
  assistant_view:
    assistant_description: Ask Smith to investigate, build, fix, or ship something.
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - channels:history
      - chat:write
      - files:read
      - groups:history
      - im:history
      - im:read
      - im:write
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - assistant_thread_started
      - assistant_thread_context_changed
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
