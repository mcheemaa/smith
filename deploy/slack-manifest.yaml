display_information:
  name: Smith
  description: An engineer on your team with a machine of its own. Give it a task in Slack and it comes back with a pull request.
  long_description: >-
    Smith is an engineer with a machine of its own. Mention it with a task, or message it directly, and it works in a thread:
    it reads the code, fixes the bug or builds the feature, runs the tests, and comes back with a pull request and a plain
    summary of what it did.

    It also answers questions about how things work, checks a page in a real browser and shares screenshots, pulls numbers
    from the database, writes docs and posts, sends email, and takes issues assigned to it in Linear. Every few hours it does
    a round on its own: it follows up on its open pull requests, fixes what failed, and posts what changed.

    It remembers what it learns, keeps its own notes, and gets better at the work over time.
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Smith
    always_online: true
  assistant_view:
    assistant_description: Give Smith a task or ask it a question. It works in a thread and comes back with what it did and a link.
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - bookmarks:write
      - canvases:read
      - canvases:write
      - channels:history
      - channels:join
      - channels:manage
      - channels:read
      - chat:write
      - chat:write.public
      - files:read
      - files:write
      - groups:history
      - groups:write
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - mpim:write
      - pins:write
      - reactions:read
      - reactions:write
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - assistant_thread_started
      - assistant_thread_context_changed
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
